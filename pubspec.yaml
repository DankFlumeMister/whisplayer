name: whisplayer
description: "Whisplayer - A polished local & self-hosted music player (Subsonic/Navidrome)."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.14.0-10.0.dev

dependencies:
  audio_metadata_reader: ^1.7.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_overlay_window: ^0.5.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.0.0
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^16.0.0
  http: ^1.6.0
  intl: any
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  permission_handler: 12.0.0

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FDF8FF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
