name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Master channel required (see ci.yml comment).
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.48.0-0.3.pre
          cache: true

      # 正式签名（2026-09-06）：若仓库配置了 KEYSTORE_BASE64 等 4 个 secrets 就用正式证书，
      # 否则留空 → build.gradle.kts 回退 debug 签名（此时 APK 与本地正式签名不兼容，
      # 用户侧会出现「无法覆盖安装」，所以发版前务必把 secrets 配好）。
      - name: Restore release keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/whisplayer-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=whisplayer-release.jks
          EOF

      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test --reporter compact
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             whisplayer-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: whisplayer-${{ github.ref_name }}.apk
          generate_release_notes: true
