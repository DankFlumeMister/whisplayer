name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Master channel required (see ci.yml comment).
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.48.0-0.2.pre
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter compact
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             whisplayer-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: whisplayer-${{ github.ref_name }}.apk
          generate_release_notes: true
