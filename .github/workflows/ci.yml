name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Project targets the Flutter master channel (SDK constraint
      # ^3.14.0-10.0.dev); stable channels cannot resolve it.
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.48.0-0.2.pre
          cache: true

      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test --reporter compact
